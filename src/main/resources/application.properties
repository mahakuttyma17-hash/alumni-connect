spring.application.name=alumni-management-system
server.port=8080

# Optional private settings file in the project root (ignored by git).
spring.config.import=optional:file:./local.properties

# MongoDB connection. Boot 4 reads spring.mongodb.uri.
# There is deliberately NO localhost fallback: if MONGODB_URI is missing,
# the app stops with a clear error instead of silently using localhost.
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# First administrator (values come from local.properties or environment variables)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.reset-password=${ADMIN_RESET_PASSWORD:false}

# Session cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Development
spring.web.resources.cache.period=0
server.error.include-message=never
server.error.include-stacktrace=never